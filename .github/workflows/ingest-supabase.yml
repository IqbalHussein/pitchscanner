# Loads real StatsBomb data into the owner's Supabase Postgres. Manual only: the
# free plan holds 500 MB, so what goes in is a deliberate choice (E1 only, a
# subset of competitions) and the job refuses to finish green when the database
# is close enough to the limit that Supabase would start refusing writes.
#
# Needs the repository secret SUPABASE_DB_URL: the *session-mode* pooler URI
# (Supavisor, port 5432, host aws-*.pooler.supabase.com). The direct host
# db.<ref>.supabase.co is IPv6-only and GitHub runners cannot reach it, and the
# transaction-mode pooler (port 6543) cannot run migrations or a long ingest.
# The Vercel app uses the transaction-mode URI instead; see the README.
name: ingest-supabase

on:
  workflow_dispatch:
    inputs:
      competitions:
        description: 'Comma-separated competition_id or competition_id:season_id, e.g. 55:282,9'
        required: true
        type: string
      encodings:
        description: 'Encodings to compute and store (the free plan only fits E1)'
        required: false
        default: 'E1'
        type: string
      limit:
        description: 'Stop after N matches (optional, for a trial run)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'
  # Supabase refuses writes at 500 MB; stop well before that. 450 MiB in bytes.
  MAX_DB_BYTES: '471859200'

# Two runs against one database would interleave upserts and index builds.
concurrency:
  group: ingest-supabase
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Never echoed. GitHub masks the secret in logs; nothing here prints it.
      PITCHSCANNER_DSN: ${{ secrets.SUPABASE_DB_URL }}
      PITCHSCANNER_STORE: postgres
      # Inputs go through the environment rather than being interpolated into
      # the shell script, so a stray quote in an input cannot become a command.
      INPUT_COMPETITIONS: ${{ inputs.competitions }}
      INPUT_ENCODINGS: ${{ inputs.encodings }}
      INPUT_LIMIT: ${{ inputs.limit }}
    steps:
      - name: Check the database secret is set
        id: check
        run: |
          if [ -z "$PITCHSCANNER_DSN" ]; then
            echo "::error title=SUPABASE_DB_URL is empty::Create the repository secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions) with the Supabase session-pooler URI (port 5432)."
            exit 1
          fi
          case "$PITCHSCANNER_DSN" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=SUPABASE_DB_URL is not a Postgres URI::It must start with postgresql:// (copy it from Supabase > Connect > Session pooler)."
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: |
          python -m pip install --upgrade pip wheel
          pip install -e backend
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Ingest the selected competitions
        run: |
          args=(--competitions "$INPUT_COMPETITIONS" --encodings "$INPUT_ENCODINGS")
          if [ -n "$INPUT_LIMIT" ]; then
            args+=(--limit "$INPUT_LIMIT")
          fi
          python -m pitchscanner.cli --store postgres ingest "${args[@]}"
      - name: Database size against the free-plan budget
        # Runs even when the ingest failed: a write refused at the size limit is
        # exactly when the numbers are wanted.
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          total=$(psql "$PITCHSCANNER_DSN" -At -c "SELECT pg_database_size(current_database())")
          {
            echo "### Database size"
            echo
            echo "Total: $((total / 1024 / 1024)) MiB of a $((MAX_DB_BYTES / 1024 / 1024)) MiB budget (free plan: 500 MB)"
            echo
            echo '```'
            psql "$PITCHSCANNER_DSN" -c "
              SELECT relname AS relation,
                     pg_size_pretty(pg_total_relation_size(c.oid)) AS total,
                     pg_size_pretty(pg_relation_size(c.oid)) AS table_only
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
              ORDER BY pg_total_relation_size(c.oid) DESC"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt "$MAX_DB_BYTES" ]; then
            echo "::error title=Database over budget::${total} bytes exceeds ${MAX_DB_BYTES}. Supabase will refuse writes at 500 MB; ingest fewer competitions or drop data before the next run."
            exit 1
          fi
