[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchscanner"
version = "0.1.0"
description = "Query-by-sketch search over StatsBomb positional data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "orjson>=3.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]
llm = ["anthropic>=0.34"]

[project.scripts]
pitchscanner = "pitchscanner.cli:main"

[tool.setuptools.packages.find]
include = ["pitchscanner*"]

[tool.setuptools.package-data]
pitchscanner = ["filters/*.yaml", "store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (Testcontainers or PITCHSCANNER_DSN)",
    "slow: nightly tier",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pitchscanner.encoders.*",
    "pitchscanner.labeller",
    "pitchscanner.stats",
    "pitchscanner.geometry",
]
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*", "scipy.*", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.report]
include = [
    "pitchscanner/encoders/*",
    "pitchscanner/labeller.py",
    "pitchscanner/stats.py",
    "pitchscanner/geometry.py",
    "pitchscanner/filters/*",
]
fail_under = 85
