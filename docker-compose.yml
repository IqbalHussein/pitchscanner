# The whole stack locally: `make up`.
#
# The database is built by the batch job and restored from a dump in production,
# so nothing here runs ingestion on start; `make ingest` does that explicitly.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pitchscanner
      POSTGRES_PASSWORD: pitchscanner
      POSTGRES_DB: pitchscanner
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitchscanner -d pitchscanner']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      PITCHSCANNER_DSN: postgresql://pitchscanner:pitchscanner@db:5432/pitchscanner
      PITCHSCANNER_STORE: postgres
      PITCHSCANNER_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      PITCHSCANNER_INDEX_KIND: hnsw
    depends_on:
      db:
        condition: service_healthy
    ports: ['8000:8000']

  web:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on: [api]
    ports: ['8080:80']

  # One-shot: ingest the checked-in fixtures into the database.
  # `docker compose run --rm ingest` (or `make ingest-docker`).
  ingest:
    build:
      context: ./backend
    profiles: ['tools']
    environment:
      PITCHSCANNER_DSN: postgresql://pitchscanner:pitchscanner@db:5432/pitchscanner
      PITCHSCANNER_STORE: postgres
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: ['python', '-m', 'pitchscanner.cli', 'ingest', '--data-dir', '/app/data/fixtures/statsbomb']

  # --- monitoring (profile: monitoring) ----------------------------------
  # `docker compose --profile monitoring up -d` adds Prometheus, Grafana with the
  # dashboard already provisioned, and a blackbox probe of /readyz.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['monitoring']
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']
    depends_on: [api]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ['monitoring']

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ['monitoring']
    environment:
      # Local-only stack; anonymous viewing keeps the demo one click away.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [prometheus]

volumes:
  pgdata:
