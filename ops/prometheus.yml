# Scrapes the API's own /metrics, plus a blackbox probe of /readyz so an
# outage shows up as a failed probe rather than as missing data.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pitchscanner-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:8000/readyz']
    relabel_configs:
      # Report the probed URL as the instance, not the exporter's address.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
